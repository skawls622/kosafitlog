<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kosaFitLog 루틴 수정</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="routine-page routine-form-page">
    <div class="app-layout">
        <header th:replace="fragments/dashboard-header :: header('routines')"></header>
        <main class="main-content">
            <div class="content-shell narrow">
                <header class="page-header">
                    <div>
                        <h1 class="page-title">루틴 수정</h1>
                        <p class="page-description">루틴 이름과 설명을 현재 운동 계획에 맞게 수정하세요.</p>
                    </div>
                </header>

                <p class="alert" role="alert" th:if="${modifyError}" th:text="${modifyError}"></p>

                <form class="card form-card" th:action="@{/routine/modify}" method="post">
                    <input type="hidden" name="routineId" th:value="${routine.routineId}">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label" for="routineName">루틴명</label>
                            <input class="form-control" id="routineName" name="routineName"
                                   type="text" maxlength="100" required
                                   th:value="${routine.routineName}">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="description">설명 <span class="routine-field-note">선택</span></label>
                            <textarea class="form-textarea" id="description" name="description"
                                      maxlength="500"
                                      th:text="${routine.description}"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <a class="btn btn-secondary"
                           th:href="@{/routine/read(routineId=${routine.routineId})}">취소</a>
                        <button class="btn btn-primary" type="submit">수정하기</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
