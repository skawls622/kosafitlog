<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kosaFitLog 루틴 상세</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .exercise-info-action { min-width: 0; }
        .exercise-info-action .exercise-name { overflow-wrap: anywhere; }
        .exercise-info-link {
            display: flex;
            width: fit-content;
            min-height: 44px;
            align-items: center;
            margin-top: 4px;
            padding-right: 8px;
            color: var(--kf-action-primary);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        .exercise-info-link:hover { text-decoration: underline; }
        .exercise-info-link:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside th:replace="fragments/sidebar :: sidebar('routines')"></aside>

        <main class="main-content">
            <div class="content-shell">
                <header class="page-header">
                    <div>
                        <h1 class="page-title" th:text="${routine.routineName}"></h1>
                        <p class="page-description">루틴 상세 · 운동 구성을 확인하고 바로 운동을 시작하세요.</p>
                    </div>
                    <div class="page-actions">
                        <a class="btn btn-secondary"
                           th:href="@{/routine/modify(routineId=${routine.routineId})}">수정</a>
                        <form th:action="@{/routine/remove}" method="post"
                              onsubmit="return confirm('루틴이 삭제됩니다. 삭제하시겠습니까?');">
                            <input type="hidden" name="routineId" th:value="${routine.routineId}">
                            <button class="btn btn-danger" type="submit">루틴 삭제</button>
                        </form>
                    </div>
                </header>

                <p class="alert" th:if="${startError}" th:text="${startError}"></p>

                <section class="card summary-card">
                    <h2 class="summary-title" th:text="${routine.routineName}"></h2>
                    <p class="summary-description" th:text="${routine.description}"></p>
                    <div class="summary-meta">
                        <span class="badge badge-primary">나의 루틴</span>
                        <span class="date-text">
                            등록일 <span th:text="${routine.createdAt}"></span>
                        </span>
                    </div>
                </section>

                <section class="card">
                    <div class="card-header">
                        <h2 class="card-title">구성 운동</h2>
                        <a class="btn btn-secondary"
                           th:href="@{/routine/exercise/add(routineId=${routine.routineId})}">
                            + 운동 추가
                        </a>
                    </div>

                    <div class="empty-state" th:if="${#lists.isEmpty(routineExercises)}">
                        <h3 class="empty-state-title">아직 등록된 운동이 없습니다</h3>
                        <p class="empty-state-text">운동을 추가한 다음 루틴을 시작할 수 있어요.</p>
                    </div>

                    <ol class="exercise-list" th:unless="${#lists.isEmpty(routineExercises)}">
                        <li class="list-row" th:each="routineExercise : ${routineExercises}">
                            <span class="list-row-index" aria-hidden="true"></span>
                            <div class="exercise-info-action">
                                <strong class="exercise-name"
                                        th:text="${routineExercise.exerciseName}"></strong>
                                <span class="badge badge-muted"
                                      th:text="${routineExercise.bodyPart}"></span>
                                <a class="exercise-info-link"
                                   th:href="@{/exercise/info(exerciseId=${routineExercise.exerciseId})}">운동 정보 →</a>
                            </div>
                            <span class="exercise-memo" th:if="${routineExercise.memo}"
                                  th:text="${routineExercise.memo}"></span>
                            <form th:action="@{/routine/exercise/remove}" method="post"
                                  onsubmit="return confirm('루틴에서 이 운동을 제거하시겠습니까?');">
                                <input type="hidden" name="routineId"
                                       th:value="${routine.routineId}">
                                <input type="hidden" name="routineExerciseId"
                                       th:value="${routineExercise.routineExerciseId}">
                                <button class="btn btn-secondary btn-sm" type="submit">제거</button>
                            </form>
                        </li>
                    </ol>
                </section>

                <div class="completion-bar">
                    <form th:action="@{/workout/start}" method="post"
                          onsubmit="return confirm('이 루틴으로 운동을 시작하시겠습니까?');">
                        <input type="hidden" name="routineId" th:value="${routine.routineId}">
                        <button class="btn btn-primary btn-wide" type="submit">
                            이 루틴으로 운동 시작
                        </button>
                    </form>
                </div>
                <p><a class="text-link" th:href="@{/routine/list}">← 루틴 목록으로 돌아가기</a></p>
            </div>
        </main>
    </div>
</body>
</html>
