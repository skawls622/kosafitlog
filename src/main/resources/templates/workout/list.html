<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kosaFitLog 운동 기록 목록</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <div class="app-layout">
        <aside th:replace="fragments/sidebar :: sidebar('workouts')"></aside>

        <main class="main-content">
            <div class="content-shell">
                <header class="page-header">
                    <div>
                        <h1 class="page-title"
                            th:text="${selectedDate != null ? selectedDate.toString() + ' 운동 기록' : '운동 기록'}">운동 기록</h1>
                        <p class="page-description">최근 운동과 세트 기록을 다시 확인할 수 있어요.</p>
                    </div>
                    <a class="btn btn-secondary" th:if="${selectedDate != null}"
                       th:href="@{/workout/list}">전체 운동 기록 보기</a>
                </header>

                <section class="card empty-state" th:if="${#lists.isEmpty(workoutLogs)}">
                    <h2 class="empty-state-title"
                        th:text="${selectedDate != null ? '선택한 날짜에 완료된 운동 기록이 없습니다' : '아직 운동 기록이 없습니다'}">아직 운동 기록이 없습니다</h2>
                    <p class="empty-state-text" th:if="${selectedDate == null}">루틴을 선택해 첫 운동을 시작해보세요.</p>
                </section>

                <section class="card history-card" th:unless="${#lists.isEmpty(workoutLogs)}">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>운동일</th>
                                <th>상태</th>
                                <th>상세보기</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="workoutLog : ${workoutLogs}">
                                <td th:text="${workoutLog.workoutDate}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${workoutLog.updatedAt == null} ? ' badge-primary' : ' badge-success'"
                                          th:text="${workoutLog.updatedAt == null ? '진행 중' : '완료'}"></span>
                                </td>
                                <td>
                                    <a class="btn btn-secondary btn-sm"
                                       th:href="@{/workout/record(workoutLogId=${workoutLog.workoutLogId})}">
                                        상세보기
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>
                <p><a class="text-link" th:href="@{/routine/list}">← 루틴 목록으로 돌아가기</a></p>
            </div>
        </main>
    </div>
</body>
</html>
