<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kosaFitLog 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-brand" aria-label="kosaFitLog 소개">
            <div class="auth-brand-inner">
                <span class="auth-kicker">PERSONAL FITNESS LOG</span>
                <h1 class="auth-logo">kosaFitLog!</h1>
                <p class="auth-slogan">나만의 루틴으로<br>꾸준한 변화를 시작하세요.</p>
                <p class="auth-copy">운동 계획부터 세트 기록까지<br>간결하게 관리할 수 있어요.</p>
                <div class="auth-accent" aria-hidden="true"></div>
            </div>
        </section>

        <section class="auth-main">
            <div class="auth-card">
                <h2 class="auth-title">회원가입</h2>
                <p class="auth-description">kosaFitLog와 함께 운동 기록을 시작해보세요.</p>

                <p class="alert alert-success" th:if="${signupSuccess}">
                    회원가입이 완료되었습니다.
                </p>
                <p class="alert" th:if="${signupError}" th:text="${signupError}"></p>

                <form class="form-grid" th:action="@{/member/signup}" method="post">
                    <div class="form-group">
                        <label class="form-label" for="loginId">아이디</label>
                        <input class="form-control" id="loginId" name="loginId"
                               type="text" maxlength="50" required
                               placeholder="사용할 아이디를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">비밀번호</label>
                        <input class="form-control" id="password" name="password"
                               type="password" required autocomplete="new-password"
                               placeholder="비밀번호를 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="nickname">닉네임</label>
                        <input class="form-control" id="nickname" name="nickname"
                               type="text" maxlength="30" required
                               placeholder="화면에 표시할 이름을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">이메일 <span class="date-text">(선택)</span></label>
                        <input class="form-control" id="email" name="email"
                               type="email" maxlength="100"
                               placeholder="이메일을 입력하세요">
                    </div>
                    <button class="btn btn-primary btn-block" type="submit">가입하기</button>
                </form>

                <p class="auth-footer">
                    이미 계정이 있나요?
                    <a th:href="@{/member/login}">로그인</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
